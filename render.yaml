# render.yaml
# This file configures the services for deploying the Guardiana monorepo on Render.

databases:
  - name: guardiana-db
    databaseName: guardiana
    user: guardiana_user
    plan: free

services:
  # Backend Service (Express.js)
  - type: web
    name: guardiana-backend
    env: node
    rootDir: apps/backend
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: guardiana-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # Environment variables for Supabase Storage
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET_NAME
        value: "guardiana-uploads"

  # Frontend Service (Next.js)
  - type: web
    name: guardiana-frontend
    env: node
    rootDir: apps/frontend
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false
